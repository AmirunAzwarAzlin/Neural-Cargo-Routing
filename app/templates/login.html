<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SDOC — Sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<form class="login-card" method="post" action="/login">
  <h1>SDOC</h1>
  <p class="muted">Shipping Document Verification — reviewer sign-in</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="text" name="reviewer_name" placeholder="Your name (for the audit trail)" autofocus required maxlength="100">
  <input type="password" name="password" placeholder="Dashboard password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
